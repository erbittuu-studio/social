name: post

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "send, check or dry"
        default: dry

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        env:
          FB_PAGES_TOKEN: ${{ secrets.FB_PAGES_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          case "$MODE" in
            send) node scripts/post.mjs --send --days 14 ;;
            check) node scripts/post.mjs --check ;;
            *) node scripts/post.mjs ;;
          esac
      - name: Save state
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'send' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages
          if ! git diff --cached --quiet; then
            git commit -m "chore: record scheduled posts"
            git push
          fi
